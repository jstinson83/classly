<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classly</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #f5f7fb; color: #1d2433; }
    main { max-width: 56rem; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .75rem; }
    h1 { margin: 0; font-size: 1.6rem; }
    #month-label { font-size: 1.2rem; font-weight: 600; min-width: 9rem; text-align: center; }
    .nav { display: flex; align-items: center; gap: .4rem; }
    button { font: inherit; padding: .45rem .9rem; border: 0; border-radius: .5rem;
             background: #3b5bdb; color: #fff; cursor: pointer; }
    button.secondary { background: #e3e8f4; color: #1d2433; }
    button:disabled { opacity: .6; cursor: default; }
    #grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #d5dbe8;
            border: 2px solid #d5dbe8; border-radius: .6rem; overflow: hidden; }
    .dow { background: #eef1f8; text-align: center; font-size: .8rem; padding: .3rem 0; font-weight: 600; }
    .day { background: #fff; min-height: 5.5rem; padding: .25rem; cursor: pointer; overflow: hidden; }
    .day.other { background: #f8f9fc; color: #8a93a8; }
    .day.selected { outline: 2px solid #3b5bdb; outline-offset: -2px; }
    .day .num { font-size: .85rem; }
    .day.today .num { background: #3b5bdb; color: #fff; border-radius: 1rem; padding: 0 .4rem; }
    .chip { display: block; font-size: .72rem; background: #dbe4ff; color: #2b3f9e; border-radius: .25rem;
            padding: 1px 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .more { font-size: .7rem; color: #5b6478; }
    section { background: #fff; border-radius: .6rem; padding: 1rem; margin-top: 1rem; }
    h2 { margin: 0 0 .6rem; font-size: 1.1rem; }
    form { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .75rem; }
    input { font: inherit; padding: .4rem; border: 1px solid #c3cadb; border-radius: .4rem; }
    input[name=title] { flex: 1 1 12rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: .6rem; padding: .4rem 0; border-top: 1px solid #eef1f8; }
    li .time { color: #5b6478; min-width: 4.5rem; font-variant-numeric: tabular-nums; }
    li .title { flex: 1; }
    li button { padding: .2rem .6rem; }
    .empty { color: #5b6478; }
    footer { margin-top: 1.5rem; text-align: center; font-size: .9rem; color: #5b6478; }
    #result.error { color: #c92a2a; }
    #camera { position: fixed; left: 1rem; bottom: 1rem; width: 3.5rem; height: 3.5rem; padding: 0;
              border-radius: 50%; font-size: 1.6rem; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    #cycle { position: fixed; left: 5.5rem; bottom: 1rem; width: 3.5rem; height: 3.5rem; padding: 0;
             border-radius: 50%; font-size: 1.6rem; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    #review .menu { display: flex; flex-direction: column; gap: .5rem; align-items: stretch; }
    #review select { font: inherit; padding: .3rem; border: 1px solid #c3cadb; border-radius: .4rem; }
    #review { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end;
              justify-content: center; z-index: 10; }
    #review[hidden] { display: none; }
    #review .sheet { background: #fff; width: 100%; max-width: 40rem; max-height: 85vh; overflow: auto;
                     border-radius: .8rem .8rem 0 0; padding: 1rem; }
    #review .row { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; padding: .4rem 0; border-top: 1px solid #eef1f8; }
    #review .row input[type=text] { flex: 1 1 10rem; }
    #review .actions { display: flex; gap: .5rem; margin-top: .75rem; }
    #review .weekly { font-size: .75rem; color: #5b6478; }
    #import-status.error { color: #c92a2a; }
    @media (max-width: 480px) { .day { min-height: 4rem; } .chip { font-size: .65rem; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><a href="/" style="color:inherit;text-decoration:none">Classly</a></h1>
      <div class="nav">
        <button class="secondary" id="prev" aria-label="Previous month">‹</button>
        <span id="month-label"></span>
        <button class="secondary" id="next" aria-label="Next month">›</button>
        <button class="secondary" id="today">Today</button>
      </div>
    </header>
    <div id="grid"></div>
    <section>
      <h2 id="day-heading"></h2>
      <form id="add-form">
        <input name="title" placeholder="Add an event (e.g. Math test)" required maxlength="120">
        <input name="time" type="time" aria-label="Time (optional)">
        <button type="submit">Add</button>
      </form>
      <ul id="day-events"></ul>
    </section>
    <footer>
      <button class="secondary" id="hello">Hello Gemini</button>
      <p id="result"></p>
    </footer>
  </main>
  <button id="camera" aria-label="Import schedule or agenda from a photo" title="Import from photo">📷</button>
  <input type="file" id="photo" accept="image/*" hidden>
  <button id="cycle" aria-label="Rotating day schedule" title="Rotating day schedule">🔁</button>
  <input type="file" id="cycle-calendar-photo" accept="image/*" hidden>
  <input type="file" id="cycle-schedule-photo" accept="image/*" hidden>
  <div id="review" hidden>
    <div class="sheet">
      <h2 id="review-title">Importing…</h2>
      <p id="import-status"></p>
      <div id="review-rows"></div>
      <div class="actions">
        <button id="review-add" hidden>Add selected to calendar</button>
        <button class="secondary" id="review-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
  <script src="/cyclelib.js"></script>
  <script src="/cycle.js"></script>
</body>
</html>
