<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Classly - School, organized.</title>
  <meta name="description" content="Photograph your schedule or agenda and it lands in your calendar. Classly helps you plan homework and study time.">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; padding: 1rem; background: #f5f7fb; color: #1d2433; }
    main { width: 100%; max-width: 26rem; text-align: center; }
    h1 { margin: 0 0 .4rem; font-size: 2.6rem; }
    .tagline { color: #5b6478; margin: 0 0 1.5rem; line-height: 1.5; }
    .card { background: #fff; border-radius: .9rem; padding: 1.5rem; box-shadow: 0 2px 12px rgba(29, 36, 51, .08); }
    .card h2 { margin: 0 0 1rem; font-size: 1.1rem; }
    .google { display: flex; align-items: center; justify-content: center; gap: .7rem; width: 100%; padding: .75rem 1rem;
              border: 1px solid #d0d6e4; border-radius: .6rem; background: #fff; color: #1d2433; font-size: 1rem;
              font-weight: 500; text-decoration: none; }
    .google:hover { background: #f5f7fb; }
    .google svg { width: 1.25rem; height: 1.25rem; }
    .error { color: #b3261e; margin: 0 0 1rem; }
    ul { list-style: none; padding: 0; margin: 1.5rem 0 0; color: #5b6478; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <h1>Classly</h1>
    <p class="tagline">School, organized. Snap your schedule, see your week, and let AI plan your homework.</p>
    <div class="card">
      <h2>Welcome</h2>
      <p class="error" id="error" hidden>Sign-in didn't work. Please try again.</p>
      <a class="google" href="/auth/google">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
          <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Sign in with Google
      </a>
      <ul>
        <li>📷 Photograph a schedule or agenda</li>
        <li>📅 Everything lands on your calendar</li>
        <li>💬 Chat with AI to plan study time</li>
      </ul>
    </div>
  </main>
  <script>
    if (new URLSearchParams(location.search).has('error')) document.getElementById('error').hidden = false;
  </script>
</body>
</html>
